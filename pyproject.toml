[project]
name = "BookVault"
version = "0.2.0"
description = "A self-hosted catalog for the books you already have on disk"
authors = [
    { name = "Alexey Yurko", email = "a.yurko@gmail.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "sqlalchemy>=2.0.35",
    "ebooklib>=0.20",
    "pillow>=13.0.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33",
    "pypdf2>=3.0.1",
    "pycryptodome>=4.2.0",
    "pypdfium2>=5.14.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "alembic>=1.20.1",
    "rapidfuzz>=3.14.6",
    "httpx2>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.isort]
skip = ["env.py"]
skip_glob = ["alembic/versions/*.py", ".venv/**/*"]
src_paths = ["src"]
multi_line_output = 3
force_grid_wrap = 2
include_trailing_comma = true
line_length = 120

[tool.ruff]
lint.select = ["E4", "E7", "E9", "F", "RUF", "I", "SIM", "UP", "FURB", "PIE", "PERF", "C4", "B", "PL", "S", "PTH118"]
lint.ignore = ["E501", "RUF013", "UP007", "B008", "D103", "D100", "D101", "D107", "D102", "D104", "Q000", "COM812", "G004", "N815"]


line-length = 122

exclude = [
    ".git",
    "__pycache__",
    "old",
    "inactive",
    "venv",
    "env",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S603", "PLR2004"]
