{% extends 'base.html' %}

{% block title %}Confirm Sync — BookVault{% endblock %}

{% block content %}
<div class="mx-auto mt-12 max-w-md px-4 sm:px-6">
    <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-800">
        <div class="mb-4 flex items-center gap-3">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-amber-100 text-amber-600 dark:bg-amber-500/15 dark:text-amber-400">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"/>
                    <path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                    <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-semibold text-slate-900 dark:text-white">Synchronize library?</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400">This will scan the configured books directory and add any new files.</p>
            </div>
        </div>

        <form action="{{ url_for('sync_books') }}" method="post" class="flex flex-col gap-3 sm:flex-row-reverse">
            <button type="submit" class="btn btn-primary w-full">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"/>
                    <path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                    <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
                Sync now
            </button>
            <a href="{{ url_for('homepage') }}" class="btn btn-secondary w-full">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
