<nav class="mx-auto max-w-7xl px-4 sm:px-6">
    <div class="flex h-16 items-center justify-between gap-4">
        <a href="{{ url_for('homepage') }}" class="flex shrink-0 items-center gap-2.5 text-lg font-bold tracking-tight text-slate-900 dark:text-white">
            <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-white">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
            </span>
            BookVault
        </a>

        <div class="flex items-center gap-2">
            <form hx-get="{{ url_for('search_books') }}" hx-trigger="submit" hx-target="#books-list" hx-push-url="true"
                class="relative">
                <svg class="pointer-events-none absolute left-2.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="search-navbar" name="query" placeholder="Search books…"
                    class="input w-36 pl-8 sm:w-56 lg:w-72">
            </form>
            <a href="{{ url_for('show_add_books_view') }}" class="btn btn-primary">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span class="hidden sm:inline">Add</span>
            </a>
            <button type="button" onclick="document.getElementById('sync-dialog').showModal()" class="btn btn-secondary">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"/>
                    <path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                    <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
                <span class="hidden sm:inline">Sync</span>
            </button>
            <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
                <svg class="h-5 w-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <svg class="hidden h-5 w-5 dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Batch operations - hidden until books are selected -->
    <div id="batch-operations" class="hidden flex flex-wrap items-center gap-2 border-t border-slate-200 py-3 dark:border-slate-700">
        <span class="text-sm font-medium text-slate-600 dark:text-slate-300">
            <span id="selected-count">0</span> selected
        </span>
        <select name="action" id="action-select" class="input py-1">
            <option value="update_tags">Update tags</option>
            <option value="delete">Delete</option>
        </select>
        <input type="text" name="tags" id="tags-input" placeholder="Tags (comma-separated)" class="input w-44 py-1">
        <button type="button" id="apply-batch-btn" class="btn btn-primary py-1">Apply</button>
        <button type="button" id="cancel-batch-btn" class="btn btn-secondary py-1">Cancel</button>
    </div>
</nav>

<dialog id="sync-dialog" class="m-auto max-w-md rounded-lg border border-slate-200 bg-white p-0 shadow-xl backdrop:bg-slate-900/50 dark:border-slate-700 dark:bg-slate-800">
    <div class="p-6">
        <div class="mb-4 flex items-center gap-3">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-amber-100 text-amber-600 dark:bg-amber-500/15 dark:text-amber-400">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"/>
                    <path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                    <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
            </div>
            <div>
                <h2 class="text-lg font-semibold text-slate-900 dark:text-white">Synchronize library?</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400">This will scan the configured books directory and add any new files.</p>
            </div>
        </div>

        <form action="{{ url_for('sync_books') }}" method="post" class="flex flex-col gap-3 sm:flex-row-reverse">
            <button type="submit" class="btn btn-primary w-full">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"/>
                    <path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                    <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
                Sync now
            </button>
            <button type="button" onclick="document.getElementById('sync-dialog').close()" class="btn btn-secondary w-full">Cancel</button>
        </form>
    </div>
</dialog>
