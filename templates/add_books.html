{% extends 'base.html' %}

{% block title %}Add books — BookVault{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-8 sm:px-6">
    <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-800 sm:p-8">
        <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Add books</h1>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
            Upload EPUB, PDF, or DJVU files to your library.
        </p>

        {% if error %}
        <div class="mt-4 flex items-center gap-2.5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-500/40 dark:bg-red-500/10 dark:text-red-300"
            role="alert">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 8v4M12 16h.01"/>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data" action="{{ url_for('add_books') }}" class="mt-6 space-y-5">
            <div>
                <label for="files" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-200">Files</label>
                <label for="files"
                    class="flex cursor-pointer flex-col items-center justify-center gap-2 rounded-lg border-2 border-dashed border-slate-300 px-6 py-10 text-center transition-colors hover:border-indigo-400 hover:bg-indigo-50/50 dark:border-slate-600 dark:hover:border-indigo-500 dark:hover:bg-indigo-500/5">
                    <svg class="h-8 w-8 text-slate-400 dark:text-slate-500" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <path d="M17 8l-5-5-5 5"/>
                        <path d="M12 3v12"/>
                    </svg>
                    <span class="text-sm font-medium text-slate-600 dark:text-slate-300">Click to select files</span>
                    <span class="text-xs text-slate-400 dark:text-slate-500" id="file-names">or drag &amp; drop them here</span>
                </label>
                <input id="files" name="files" required type="file" multiple
                    class="sr-only"
                    accept=".epub,.pdf,.djvu,application/epub+zip,application/pdf,application/djvu"
                    onchange="document.getElementById('file-names').textContent = this.files.length + ' file(s) selected'">
            </div>

            <div>
                <label for="tags" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-200">Tags</label>
                <input id="tags" name="tags" type="text" value="" placeholder="fiction, science, …"
                    class="input w-full">
                <p class="mt-1.5 text-xs text-slate-400 dark:text-slate-500">Comma-separated, applied to all uploaded files.</p>
            </div>

            <button type="submit" class="btn btn-primary w-full py-2.5">Add books</button>
        </form>
    </div>
</div>
{% endblock %}
