{% extends 'base.html' %}

{% block title %}Synchronizing — BookVault{% endblock %}

{% block content %}
<div class="mx-auto mt-12 max-w-lg px-4 sm:px-6">
    <div id="sync-progress-card"
         class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-800"
         hx-get="{{ url_for('sync_progress_fragment', task_id=task.task_id) }}"
         hx-trigger="load delay:1s"
         hx-swap="outerHTML">
        <div class="mb-4 flex items-center gap-3">
            <svg class="h-6 w-6 animate-spin text-indigo-600" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <div>
                <h1 class="text-lg font-semibold text-slate-900 dark:text-white">Synchronizing library</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400">Importing books from the configured directory.</p>
            </div>
        </div>
        <div class="space-y-3">
            <div class="h-2.5 w-full overflow-hidden rounded-full bg-slate-100 dark:bg-slate-700">
                <div class="h-full rounded-full bg-indigo-600 transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500 dark:text-slate-400">
                <span>Connecting...</span>
                <span>Starting</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
