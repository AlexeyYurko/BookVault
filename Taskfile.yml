version: "3"

env:
  VENV: .venv/bin

tasks:
  install:
    desc: install dependencies
    cmds:
      - uv sync

  test:
    desc: run tests
    cmds:
      - "{{.VENV}}/pytest {{.CLI_ARGS}}"

  test:verbose:
    desc: run tests with verbose output
    cmds:
      - "{{.VENV}}/pytest -v {{.CLI_ARGS}}"

  test:cov:
    desc: run tests with coverage
    cmds:
      - "{{.VENV}}/pytest --cov=app --cov-report=term-missing {{.CLI_ARGS}}"

  lint:
    desc: run ruff linter
    cmds:
      - "{{.VENV}}/ruff check ."

  lint:fix:
    desc: run ruff linter with auto-fix
    cmds:
      - "{{.VENV}}/ruff check . --fix"

  format:
    desc: format code with ruff
    cmds:
      - "{{.VENV}}/ruff format ."

  format:check:
    desc: check formatting with ruff
    cmds:
      - "{{.VENV}}/ruff format --check ."

  check:
    desc: run lint and tests
    cmds:
      - task: lint
      - task: test

  dev:
    desc: run development server
    cmds:
      - "{{.VENV}}/uvicorn app.main:app --reload"

  migration:
    desc: Database migrations
    summary: |
      Manage Alembic database migrations.

      Usage:
        task migration:run       Apply all pending migrations
        task migration:+1        Upgrade one revision
        task migration:-1        Downgrade one revision

    cmds:
      - task: migration:run

  migration:run:
    desc: Apply all pending migrations
    cmds:
      - "{{.VENV}}/alembic upgrade head"

  "migration:+1":
    desc: Upgrade one revision
    cmds:
      - "{{.VENV}}/alembic upgrade +1"

  "migration:-1":
    desc: Downgrade one revision
    cmds:
      - "{{.VENV}}/alembic downgrade -1"
